[package]
name = "pastella-cad"
version = "0.3.0"
edition = "2021"
description = "PASTELLA 84 v3 CAD build: spec.json -> B-rep (truck) -> STEP / URDF / USDA / GLB + checks"
publish = false

[dependencies]
truck-modeling = "0.6.0"
truck-topology = "0.6.0"
truck-meshalgo = "0.4.0"
truck-polymesh = "0.6.0"
truck-stepio = "0.3.0"
ruststep = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
boolmesh = "0.2.1"

[profile.release]
debug = false
